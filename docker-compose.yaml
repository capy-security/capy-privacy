# Base domain (e.g. capysecurity.com). API/DNS/Admin are always api.$DOMAIN, dns.$DOMAIN, admin.$DOMAIN.
# Set DOMAIN (and optionally IP_ADDRESS) in .env.
# This compose file is standardized for `podman compose`.
services:
  capy-api:
    image: capy-api:latest
    container_name: capy-api
    restart: always
    env_file: .env
    environment:
      API_ENV: "production"
      CORE_HOST: "capy-core"
    volumes:
      - ./resources/database/:/var/capy/database/:Z
    ports:
      - "127.0.0.1:8080:8080/tcp"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - capy-internal
    build:
      context: ./api
      args:
        application: "api"
        domain: "api.${DOMAIN:-localhost}"

  capy-core:
    image: capy-core:latest
    container_name: capy-core
    restart: always
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - capy-api
    volumes:
      - ./resources/database/:/var/capy/database/:Z
      - ./ssl/:/etc/letsencrypt/:ro,Z
    ports:
      # Plain DNS (recursor) — IPv4 + IPv6
      - "53:53/udp"
      - target: 53
        published: 53
        protocol: udp
        host_ip: "::"
      # DoH (dnsdist) — IPv4 + IPv6
      - "5300:5300/tcp"
      - target: 5300
        published: 5300
        protocol: tcp
        host_ip: "::"
      # DoT (dnsdist) — IPv4 + IPv6
      - "853:853/tcp"
      - target: 853
        published: 853
        protocol: tcp
        host_ip: "::"
    expose:
      - "53"
      - "853"
      - "5300"
    ulimits:
      nofile:
        soft: 16000
        hard: 16000
    networks:
      - capy-internal
    build:
      context: ./core
      args:
        application: "core"
        domain: "dns.${DOMAIN:-localhost}"

  capy-front:
    image: capy-front:latest
    container_name: capy-front
    restart: always
    env_file: .env
    depends_on:
      - capy-api
      - capy-core
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      API_DOMAIN: api.${DOMAIN:-localhost}
      ADMIN_DOMAIN: admin.${DOMAIN:-localhost}
      DNS_DOMAIN: dns.${DOMAIN:-localhost}
      IP_ADDRESS: ${IP_ADDRESS:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./ssl/:/etc/letsencrypt/:ro,Z
      - /etc/caddy/conf.d:/etc/caddy/conf.d:ro,Z  # host custom vhosts (*.caddy)
      - /var/www/:/var/www/:ro,Z
      - /var/log/caddy/:/var/log/caddy/:Z
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    expose:
      - '80'
      - '443'
    networks:
      - capy-internal
      - capy-network
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        application: "admin"
        domain: "admin.${DOMAIN:-localhost}"
        ip_address: "${IP_ADDRESS:-127.0.0.1}"
        VITE_API_URL: "https://api.${DOMAIN:-localhost}/"

volumes:
  capy_database:

networks:
  capy-internal:
    driver: bridge
  capy-network:
    external: true
