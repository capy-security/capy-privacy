# Base domain (e.g. capysecurity.com). API/DNS/Admin are always api.$DOMAIN, dns.$DOMAIN, admin.$DOMAIN.
# Set DOMAIN (and optionally IP_ADDRESS) in .env.
# This compose file is standardized for `podman compose`.
services:
  capy_api:
    image: capy_api:latest
    restart: always
    env_file: .env
    environment:
      API_ENV: "production"
    volumes:
      - ./resources/database/:/var/capy/database/:Z
    ports:
      - "127.0.0.1:8080:8080/tcp"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    build:
      context: ./api
      args:
        application: "api"
        domain: "api.${DOMAIN:-localhost}"

  capy_core:
    image: capy_core:latest
    restart: always
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - capy_api
    volumes:
      - ./resources/database/:/var/capy/database/:Z
      - /etc/letsencrypt/:/etc/letsencrypt/:ro,Z
    ports:
      - "53:53/udp"
      - "5300:5300/tcp"
      - "853:853/tcp"
    expose:
      - "53"
      - "853"
      - "5300"
    ulimits:
      nofile:
        soft: 16000
        hard: 16000
    build:
      context: ./core
      args:
        application: "core"
        domain: "dns.${DOMAIN:-localhost}"

  capy_front:
    image: capy_front:latest
    restart: always
    env_file: .env
    depends_on:
      - capy_api
      - capy_core
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - /etc/letsencrypt/:/etc/letsencrypt/:ro,Z
      - /var/www/:/var/www/:ro,Z
      - /var/log/caddy/:/var/log/caddy/:Z
    ports:
      - '80:80/tcp'
      - '443:443/tcp'
    expose:
      - '80'
      - '443'
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        application: "admin"
        domain: "admin.${DOMAIN:-localhost}"
        ip_address: "${IP_ADDRESS:-127.0.0.1}"
        VITE_API_URL: "https://api.${DOMAIN:-localhost}/"

volumes:
  capy_database:
    # networks:
    #   local:
    #     driver: bridge
