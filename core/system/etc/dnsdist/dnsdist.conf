-- TLS paths from host-mounted /etc/letsencrypt (see compose: capy-core env DOMAIN)
local domain = os.getenv("DOMAIN") or "localhost"
local dnsname = "dns." .. domain
local cert = "/etc/letsencrypt/live/" .. dnsname .. "/fullchain.pem"
local key = "/etc/letsencrypt/live/" .. dnsname .. "/privkey.pem"

local tls_opts = { reusePort=true, minTLSVersion="tls1.2" }

addDOHLocal('0.0.0.0:5300', cert, key, '/dns-query', tls_opts)
addDOHLocal('[::]:5300', cert, key, '/dns-query', tls_opts)
addTLSLocal('0.0.0.0:853', cert, key, tls_opts)
addTLSLocal('[::]:853', cert, key, tls_opts)

-- set X(int) number of queries to be allowed per second from a IP
addAction(MaxQPSIPRule(50), DropAction())

--  drop ANY queries sent over udp
addAction(AndRule({QTypeRule(DNSQType.ANY), TCPRule(false)}), DropAction())

-- set X number of entries to be in the dnsdist cache by default
-- memory will be preallocated based on the X number
pc = newPacketCache(10000, {maxTTL=86400})
getPool(""):setCache(pc)

-- server policy to choose the downstream servers for recursion
setServerPolicy(leastOutstanding)

setACLFromFile("/etc/dnsdist/allow_from.txt")

setVerbose(true)

-- dns recursor
newServer({address="127.0.0.1:53", qps=1, name="pdns-recursor"})
setMaxTCPConnectionsPerClient(1000)
setMaxTCPQueriesPerConnection(100)
