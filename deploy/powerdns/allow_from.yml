# With Proxy Protocol, allow_from is matched against the *real client* address
# dnsdist puts in the PP header — not 127.0.0.1. Product allowlisting stays on
# dnsdist; this file must stay open so allowed clients can reach the recursor.
# Socket is still loopback-only (listen 127.0.0.1:5353) + proxy_protocol_from.
# reload with: rec_control reload-acls
- ::/0
- 0.0.0.0/0
