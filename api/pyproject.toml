[project]
name = "capy-privacy-api"
version = "0.1.0"
description = ""
authors = [
    {name = "gael-soude",email = "capy.security@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "peewee (>=4.5.1,<5.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
]

[project.scripts]
export-openapi = "export_openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/export_openapi"]
